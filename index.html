<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro 2000s Commercial Injector</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --accent: #f59e0b;
      --text: #e6edf3;
      --border: #30363d;
    }
    body {
      background: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: var(--accent); margin-bottom: 5px; }
    p { color: #8b949e; margin-top: 0; font-size: 0.9em; }
    
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .control-group {
      margin-bottom: 20px;
      padding: 15px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    
    label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--accent); }
    
    input[type="file"], input[type="range"] {
      width: 100%;
      box-sizing: border-box;
    }

    .slider-val {
      font-weight: bold;
      color: #fff;
      float: right;
    }

    button {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-size: 1.1em;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .preview-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    canvas {
      width: 640px;
      height: 480px;
      background: #000;
      border: 12px solid #222;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    
    #status {
      margin-top: 10px;
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <h1>RETRO 2000s TV INJECTOR</h1>
  <p>Format videos to 4:3 CRT aspect ratio with dynamic commercial break insertion.</p>

  <div class="container">
    <div class="control-group">
      <label for="videoInput">1. Select Source Video(s)</label>
      <input type="file" id="videoInput" accept="video/mp4,video/*" multiple />
    </div>

    <div class="control-group">
      <label>
        2. Commercial Break Frequency 
        <span class="slider-val" id="freqDisplay">Every 15 Minutes</span>
      </label>
      <input type="range" id="freqSlider" min="5" max="50" value="15" step="5" />
      <small style="color:#8b949e; display:block; margin-top:5px;">
        Pulls 3 random commercials per break from dynamic <code>./commercials/</code> manifest.
      </small>
    </div>

    <button id="processBtn">INJECT & EXPORT VIDEO</button>

    <div class="preview-container">
      <canvas id="crtCanvas" width="640" height="480"></canvas>
      <div id="status">Ready</div>
    </div>
  </div>

  <script>
    const slider = document.getElementById('freqSlider');
    const freqDisplay = document.getElementById('freqDisplay');
    const videoInput = document.getElementById('videoInput');
    const processBtn = document.getElementById('processBtn');
    const canvas = document.getElementById('crtCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');

    let commercialPool = [];

    // Dynamically load all commercial MP4 paths from commercials.json manifest
    async function loadCommercialManifest() {
      try {
        const response = await fetch('./commercials/commercials.json');
        if (response.ok) {
          const files = await response.json();
          commercialPool = files.map(f => `./commercials/${f}`);
          statusText.textContent = `Loaded ${commercialPool.length} commercials from repository.`;
        } else {
          throw new Error("No manifest found");
        }
      } catch (e) {
        // Fallback: Generate sequential check for up to 100 commercials (comm1.mp4 to comm100.mp4)
        commercialPool = Array.from({ length: 100 }, (_, i) => `./commercials/comm${i + 1}.mp4`);
        statusText.textContent = "Commercial manifest missing, using default commercial pool pattern.";
      }
    }

    loadCommercialManifest();

    slider.addEventListener('input', (e) => {
      freqDisplay.textContent = `Every ${e.target.value} Minutes`;
    });

    let audioCtx, audioDest;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioDest = audioCtx.createMediaStreamDestination();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    processBtn.addEventListener('click', async () => {
      if (!videoInput.files.length) {
        alert("Please select at least one source video file.");
        return;
      }

      initAudio();
      processBtn.disabled = true;

      const file = videoInput.files[0];
      const sourceVideo = document.createElement('video');
      sourceVideo.src = URL.createObjectURL(file);
      sourceVideo.crossOrigin = "anonymous";

      const mainAudioSource = audioCtx.createMediaElementSource(sourceVideo);
      mainAudioSource.connect(audioDest);
      mainAudioSource.connect(audioCtx.destination);

      await sourceVideo.play();

      const canvasStream = canvas.captureStream(60);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      const mediaRecorder = new MediaRecorder(combinedStream, {
        mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'
      });

      const recordedChunks = [];
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `retro_4x3_${file.name}`;
        a.click();
        statusText.textContent = "Export Complete!";
        processBtn.disabled = false;
      };

      mediaRecorder.start();

      const freqMinutes = parseFloat(slider.value);
      const breakIntervalSec = freqMinutes * 60;
      let lastBreakTime = 0;
      let isPlayingCommercial = false;

      function renderFrame() {
        if (sourceVideo.ended && !isPlayingCommercial) {
          mediaRecorder.stop();
          return;
        }

        if (!isPlayingCommercial) {
          if (sourceVideo.currentTime - lastBreakTime >= breakIntervalSec) {
            lastBreakTime = sourceVideo.currentTime;
            isPlayingCommercial = true;
            triggerCommercialBreak(sourceVideo).then(() => {
              isPlayingCommercial = false;
            });
          } else {
            draw4x3(sourceVideo);
          }
        }

        requestAnimationFrame(renderFrame);
      }

      requestAnimationFrame(renderFrame);
    });

    function draw4x3(element) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const targetRatio = 4 / 3;
      const elementRatio = element.videoWidth / element.videoHeight || targetRatio;

      let drawWidth = canvas.width;
      let drawHeight = canvas.height;
      let offsetX = 0;
      let offsetY = 0;

      if (elementRatio > targetRatio) {
        drawHeight = canvas.width / elementRatio;
        offsetY = (canvas.height - drawHeight) / 2;
      } else {
        drawWidth = canvas.height * elementRatio;
        offsetX = (canvas.width - drawWidth) / 2;
      }

      ctx.drawImage(element, offsetX, offsetY, drawWidth, drawHeight);
    }

    async function triggerCommercialBreak(mainVideo) {
      mainVideo.pause();
      statusText.textContent = "Injecting 3 Random Commercials...";

      for (let i = 0; i < 3; i++) {
        const randomCommPath = commercialPool[Math.floor(Math.random() * commercialPool.length)];
        await playSingleCommercial(randomCommPath);
      }

      statusText.textContent = "Resuming Main Video...";
      await mainVideo.play();
    }

    function playSingleCommercial(path) {
      return new Promise((resolve) => {
        const commVideo = document.createElement('video');
        commVideo.src = path;
        commVideo.crossOrigin = "anonymous";

        commVideo.onloadedmetadata = async () => {
          let commAudioSource;
          try {
            commAudioSource = audioCtx.createMediaElementSource(commVideo);
            commAudioSource.connect(audioDest);
            commAudioSource.connect(audioCtx.destination);
          } catch(e) {}

          await commVideo.play();

          function drawComm() {
            if (commVideo.ended || commVideo.paused) {
              resolve();
            } else {
              draw4x3(commVideo);
              requestAnimationFrame(drawComm);
            }
          }
          requestAnimationFrame(drawComm);
        };

        commVideo.onerror = () => {
          // If a specific file isn't found in pool, skip instantly to next
          resolve();
        };
      });
    }
  </script>
</body>
</html>
